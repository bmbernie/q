[project]
name = "q-terminal"
version = "0.4.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<0.29",
]

[project.scripts]
q = "q.cli:main"
qd = "q.daemon:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
